# Example: Node-RED with editor login (one container, no database).
# Provided as-is, without warranty.
# Start: copy .env.example to .env, fill in the secrets, then `docker compose up -d`.
services:
  node-red:
    image: nodered/node-red:5.0.9
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      NODE_RED_ADMIN_USER: ${NODE_RED_ADMIN_USER:-admin}
      NODE_RED_ADMIN_PASSWORD: ${NODE_RED_ADMIN_PASSWORD:?Set NODE_RED_ADMIN_PASSWORD in .env}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?Set NODE_RED_CREDENTIAL_SECRET in .env}
      NODE_RED_ENABLE_PROJECTS: "false"
    ports:
      # Loopback only. Put a reverse proxy (see ../caddy) in front for HTTPS.
      - "127.0.0.1:${HOST_PORT:-1880}:1880"
    volumes:
      - node_red_data:/data
      # Settings file that turns on the editor login (reads the env vars above).
      - ./settings.js:/data/settings.js:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1880/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  node_red_data:
